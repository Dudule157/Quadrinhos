<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha HQ</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Minha HQ</h1>
    </header>

    <div id="container">

        <!-- QUADRO 1 -->
        <div class="quadro">

            <img
                class="icone-balao"
                src="imagens/baloes/chat.png"
                onmouseover="balao(1)"
                onmouseout="balao2()"
                alt="balão">

            <img
                class="fala"
                id="bal1"
                src="imagens/baloes/b1.png"
                alt="fala">

            <img
                src="imagens/quadrinho/q1.png"
                alt="Quadrinho 1">

        </div>

        <!-- QUADRO 2 -->
        <div class="quadro">

            <img
                class="icone-balao"
                src="imagens/baloes/chat.png"
                onmouseover="balao(2)"
                onmouseout="balao2()"
                alt="balão">

            <img
                class="fala"
                id="bal2"
                src="imagens/baloes/Balao2.png"
                alt="fala">

            <img
                src="imagens/quadrinho/q2.png"
                alt="Quadrinho 2">

        </div>

        <!-- QUADRO 3 -->
        <div class="quadro">

            <img
                class="icone-balao"
                src="imagens/baloes/chat.png"
                onmouseover="balao(3)"
                onmouseout="balao2()"
                alt="balão">

            <img
                class="fala"
                id="bal3"
                src="imagens/baloes/Balao3.png"
                alt="fala">

            <img
                src="imagens/quadrinho/q3.png"
                alt="Quadrinho 3">

        </div>

        <!-- QUADRO 4 -->
        <div class="quadro">

            <img
                class="icone-balao"
                src="imagens/baloes/chat.png"
                onmouseover="balao(4)"
                onmouseout="balao2()"
                alt="balão">

            <img
                class="fala"
                id="bal4"
                src="imagens/baloes/Balao4.png"
                alt="fala">

            <img
                src="imagens/quadrinho/q4.png"
                alt="Quadrinho 4">

        </div>

    </div>

</body>
</html>
